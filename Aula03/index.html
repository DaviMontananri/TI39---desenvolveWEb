<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Técnico informatica</title>
    <link rel="icon" href="html-5.png" type="image/x-icon">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <h6 style="font-size: 25px; font-family: Verdana; color: black;text-align: center;">Senac Botucatu</h6>
    <h1 style="color: blueviolet;">Técnico em Informatica</h1>

    <!--
    style - atributo para estilizar elementos HTML
    background-color - para cor de fundo 
    color - para cor de texto
    font-family - para fonte de texto
    font-size - para o tamanho do texto
    text-align - para alinha os texto 
    -->
    <!--
    <br> - pula linha
    <b> - texto negrito
    <strong> texto importante
    <i> texto italico
    <em> - texto enfatizado
    <mark> texto marcado
    <small> texto pequeno
    <sub> - texto subscrito
    <sup> - texto sobrescrito     
    -->

    <p><b>Texto</b></p>
    <p><strong>Texto</strong></p>
    <p><i>Texto</i></p>
    <p><em>Texto</em></p>
    <p><mark>Texto</mark></p>
    <p><small>Texto</small></p>
    <p>Text<sub>o</sub></p>
    <p>Text<sup><sup>o</p>

    <!-- Trabalhando com cores-->

    <p style="color: tomato;">Cor</p>
    <p style="color: #e32626;">Cor</p>
    <p style="color: red;">Cor</p>
    <p style="color: rgb(red green blue / alpha);">Cor</p>

    <!--Trabalhando com tabelas-->
    <!--
    <tr> - linha da tabela 
    <th> - célula de cabeçalho
    <td> - célula de dados
    
    -->

        <h2>Clientes ativos</h2>


    <table>
        <tr>
            <th>Empresa</th>
            <th>Contato</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>Senac</td>
            <td>Geniele</td>
            <td>Botucatu</td>
        </tr>
        <tr>
            <td>Caio</td>
            <td>João</td>
            <td>Botucatu</td>  
        </tr>


    </table>
    
    
</body>
</html>
